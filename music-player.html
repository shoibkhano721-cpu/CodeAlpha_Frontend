<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music Player — PlayHub</title>
<style>
  :root{
    --bg:#0f1419; --card:#1a1f28; --ink:#f1f4f6; --muted:#8a96a4;
    --primary:#ff6b9d; --accent:#00d4ff; --success:#00d94f;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Segoe UI', Helvetica, Arial, sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:1rem;
  }

  .container{
    width:100%; max-width:500px;
  }

  .header{
    text-align:center; margin-bottom:2rem;
  }
  .header h1{
    font-size:2rem; margin:0; color:var(--primary);
    font-weight:700; letter-spacing:1px;
  }
  .header p{
    color:var(--muted); margin:0.3rem 0 0; font-size:0.9rem;
  }

  .player{
    background:var(--card); border-radius:16px; padding:2rem;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.05);
  }

  .album-art{
    width:100%; aspect-ratio:1; border-radius:12px;
    background:linear-gradient(135deg, rgba(255,107,157,.3), rgba(0,212,255,.3));
    display:flex; align-items:center; justify-content:center;
    font-size:4rem; margin-bottom:1.5rem;
    overflow:hidden; position:relative;
  }
  .album-art.playing::after{
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle, transparent 30%, rgba(255,107,157,.1) 100%);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%, 100%{ opacity:0.5; }
    50%{ opacity:1; }
  }

  .song-info{
    text-align:center; margin-bottom:1.5rem;
  }
  .song-title{
    font-size:1.4rem; font-weight:600; margin:0 0 0.3rem;
    color:var(--ink);
  }
  .song-artist{
    color:var(--muted); font-size:0.95rem; margin:0;
  }

  .time-display{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:0.8rem; font-size:0.85rem; color:var(--muted);
  }
  .time-display span:first-child, .time-display span:last-child{
    font-family:monospace; font-weight:500;
  }

  .progress-bar{
    width:100%; height:6px; background:rgba(255,255,255,.1);
    border-radius:3px; cursor:pointer; margin-bottom:1.5rem;
    overflow:hidden;
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg, var(--primary), var(--accent));
    border-radius:3px; width:0%; transition:width 0.1s linear;
  }
  .progress-bar:hover .progress-fill{
    height:8px; margin-top:-1px;
  }

  .controls{
    display:flex; gap:0.8rem; justify-content:center; margin-bottom:1.5rem;
    align-items:center;
  }
  .btn{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
    color:var(--ink); border-radius:50%; width:48px; height:48px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all 0.2s; font-size:1.1rem;
  }
  .btn:hover{
    background:rgba(255,255,255,.1); border-color:var(--primary);
    color:var(--primary);
  }
  .btn:active{ transform:scale(0.95); }
  .btn:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }

  .play-btn{
    width:56px; height:56px; background:linear-gradient(135deg, var(--primary), var(--accent));
    border:none; color:#fff; font-size:1.3rem;
  }
  .play-btn:hover{
    background:linear-gradient(135deg, var(--accent), var(--primary));
    box-shadow:0 8px 20px rgba(255,107,157,.4);
  }

  .volume-control{
    display:flex; align-items:center; gap:0.8rem; margin-bottom:1.5rem;
  }
  .volume-icon{
    color:var(--muted); font-size:1.1rem;
  }
  .volume-slider{
    flex:1; height:4px; background:rgba(255,255,255,.1);
    border-radius:2px; cursor:pointer; -webkit-appearance:none; appearance:none;
    background:linear-gradient(to right, rgba(255,107,157,.3) 0%, rgba(255,107,157,.3) var(--value, 70%), rgba(255,255,255,.1) var(--value, 70%), rgba(255,255,255,.1) 100%);
  }
  .volume-slider::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:12px; height:12px; border-radius:50%;
    background:var(--primary); cursor:pointer;
  }
  .volume-slider::-moz-range-thumb{
    width:12px; height:12px; border-radius:50%;
    background:var(--primary); cursor:pointer; border:none;
  }
  .volume-percent{
    color:var(--muted); font-size:0.8rem; min-width:35px; text-align:right;
  }

  .playlist-title{
    font-size:0.95rem; font-weight:600; color:var(--ink);
    margin:1.5rem 0 0.8rem; padding-bottom:0.8rem;
    border-bottom:1px solid rgba(255,255,255,.1);
  }
  .playlist{
    max-height:200px; overflow-y:auto; border-radius:8px;
  }
  .playlist-item{
    padding:0.8rem; background:rgba(255,255,255,.02);
    border:1px solid rgba(255,255,255,.05); margin-bottom:0.5rem;
    border-radius:6px; cursor:pointer; transition:all 0.2s;
    font-size:0.9rem;
  }
  .playlist-item:hover{
    background:rgba(255,107,157,.1); border-color:var(--primary);
  }
  .playlist-item.active{
    background:rgba(255,107,157,.15); border-color:var(--primary);
    color:var(--primary); font-weight:600;
  }
  .playlist-item-artist{
    font-size:0.8rem; color:var(--muted); margin-top:0.2rem;
  }

  .playlist::-webkit-scrollbar{
    width:6px;
  }
  .playlist::-webkit-scrollbar-track{
    background:rgba(255,255,255,.05);
  }
  .playlist::-webkit-scrollbar-thumb{
    background:var(--primary); border-radius:3px;
  }

  @media (max-width:500px){
    .player{ padding:1.5rem; }
    .album-art{ font-size:3rem; }
    .song-title{ font-size:1.2rem; }
    .btn{ width:44px; height:44px; font-size:1rem; }
    .play-btn{ width:52px; height:52px; }
    .controls{ gap:0.6rem; }
  }

  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f5f7fa; --card:#fff; --ink:#1a1f2e; --muted:#666;
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>PlayHub</h1>
    <p>Your favorite music player</p>
  </div>

  <div class="player">
    <!-- Album Art -->
    <div class="album-art" id="albumArt">🎵</div>

    <!-- Song Info -->
    <div class="song-info">
      <h2 class="song-title" id="songTitle">No Song Playing</h2>
      <p class="song-artist" id="songArtist">Select a song</p>
    </div>

    <!-- Time Display -->
    <div class="time-display">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn" id="prevBtn" title="Previous">⏮️</button>
      <button class="btn" id="playBtn" title="Play/Pause">▶️</button>
      <button class="btn" id="nextBtn" title="Next">⏭️</button>
      <button class="btn" id="shuffleBtn" title="Shuffle">🔀</button>
      <button class="btn" id="repeatBtn" title="Repeat">🔁</button>
    </div>

    <!-- Volume Control -->
    <div class="volume-control">
      <span class="volume-icon">🔊</span>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
      <span class="volume-percent" id="volumePercent">70%</span>
    </div>

    <!-- Playlist -->
    <div class="playlist-title">Playlist</div>
    <div class="playlist" id="playlist"></div>
  </div>
</div>

<audio id="audioPlayer"></audio>

<script>
// Playlist Data
const songs = [
  {
    id: 1,
    title: "Summer Vibes",
    artist: "The Beats",
    duration: 243,
    emoji: "☀️",
    url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
  },
  {
    id: 2,
    title: "Night Dreams",
    artist: "Luna Echo",
    duration: 256,
    emoji: "🌙",
    url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
  },
  {
    id: 3,
    title: "Ocean Waves",
    artist: "Sea Sounds",
    duration: 231,
    emoji: "🌊",
    url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
  },
  {
    id: 4,
    title: "Mountain Peak",
    artist: "Peak Sounds",
    duration: 267,
    emoji: "⛰️",
    url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
  },
  {
    id: 5,
    title: "Forest Walk",
    artist: "Nature Vibes",
    duration: 241,
    emoji: "🌲",
    url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"
  },
  {
    id: 6,
    title: "City Lights",
    artist: "Urban Beats",
    duration: 254,
    emoji: "🌃",
    url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"
  },
];

// DOM Elements
const audio = document.getElementById('audioPlayer');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const repeatBtn = document.getElementById('repeatBtn');
const volumeSlider = document.getElementById('volumeSlider');
const volumePercent = document.getElementById('volumePercent');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const songTitle = document.getElementById('songTitle');
const songArtist = document.getElementById('songArtist');
const albumArt = document.getElementById('albumArt');
const currentTimeEl = document.getElementById('currentTime');
const durationEl = document.getElementById('duration');
const playlistEl = document.getElementById('playlist');

// Player State
let currentIndex = 0;
let isPlaying = false;
let shuffle = false;
let repeatMode = 0; // 0: no repeat, 1: repeat all, 2: repeat one
let playedIndices = [];

// Initialize Playlist
function initPlaylist() {
  playlistEl.innerHTML = songs.map((song, idx) => `
    <div class="playlist-item ${idx === 0 ? 'active' : ''}" onclick="playSong(${idx})">
      <div>${song.emoji} ${song.title}</div>
      <div class="playlist-item-artist">${song.artist}</div>
    </div>
  `).join('');
}

// Format Time
function formatTime(seconds) {
  if (!seconds || isNaN(seconds)) return '0:00';
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

// Load Song
function loadSong(index) {
  const song = songs[index];
  audio.src = song.url;
  songTitle.textContent = song.title;
  songArtist.textContent = song.artist;
  albumArt.textContent = song.emoji;
  durationEl.textContent = formatTime(song.duration);
  updatePlaylistUI();
}

// Play Song
function playSong(index) {
  currentIndex = index;
  loadSong(index);
  audio.play();
  isPlaying = true;
  updatePlayBtn();
  albumArt.classList.add('playing');
}

// Toggle Play/Pause
function togglePlay() {
  if (!audio.src) {
    playSong(0);
    return;
  }
  if (isPlaying) {
    audio.pause();
    isPlaying = false;
  } else {
    audio.play();
    isPlaying = true;
  }
  updatePlayBtn();
}

function updatePlayBtn() {
  playBtn.textContent = isPlaying ? '⏸️' : '▶️';
}

// Next Song
function nextSong() {
  if (shuffle) {
    currentIndex = Math.floor(Math.random() * songs.length);
  } else {
    currentIndex = (currentIndex + 1) % songs.length;
  }
  playSong(currentIndex);
}

// Previous Song
function prevSong() {
  currentIndex = (currentIndex - 1 + songs.length) % songs.length;
  playSong(currentIndex);
}

// Toggle Shuffle
function toggleShuffle() {
  shuffle = !shuffle;
  shuffleBtn.style.color = shuffle ? 'var(--primary)' : 'var(--ink)';
  shuffleBtn.style.borderColor = shuffle ? 'var(--primary)' : 'rgba(255,255,255,.1)';
}

// Toggle Repeat
function toggleRepeat() {
  repeatMode = (repeatMode + 1) % 3;
  if (repeatMode === 0) {
    repeatBtn.style.color = 'var(--ink)';
    repeatBtn.style.borderColor = 'rgba(255,255,255,.1)';
  } else if (repeatMode === 1) {
    repeatBtn.style.color = 'var(--primary)';
    repeatBtn.style.borderColor = 'var(--primary)';
    repeatBtn.textContent = '🔁';
  } else {
    repeatBtn.textContent = '🔂';
  }
}

// Update Progress Bar
audio.addEventListener('timeupdate', () => {
  const percentage = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = percentage + '%';
  currentTimeEl.textContent = formatTime(audio.currentTime);
  volumeSlider.style.setProperty('--value', volumeSlider.value + '%');
});

// Seek Progress
progressBar.addEventListener('click', (e) => {
  const rect = progressBar.getBoundingClientRect();
  const percentage = (e.clientX - rect.left) / rect.width;
  audio.currentTime = percentage * audio.duration;
});

// Volume Control
volumeSlider.addEventListener('input', (e) => {
  const volume = e.target.value;
  audio.volume = volume / 100;
  volumePercent.textContent = volume + '%';
});

// End of Song
audio.addEventListener('ended', () => {
  if (repeatMode === 2) {
    audio.currentTime = 0;
    audio.play();
  } else {
    nextSong();
  }
});

// Update Playlist UI
function updatePlaylistUI() {
  document.querySelectorAll('.playlist-item').forEach((item, idx) => {
    item.classList.toggle('active', idx === currentIndex);
  });
}

// Event Listeners
playBtn.addEventListener('click', togglePlay);
nextBtn.addEventListener('click', nextSong);
prevBtn.addEventListener('click', prevSong);
shuffleBtn.addEventListener('click', toggleShuffle);
repeatBtn.addEventListener('click', toggleRepeat);

// Keyboard Shortcuts
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    togglePlay();
  }
  if (e.code === 'ArrowRight') nextSong();
  if (e.code === 'ArrowLeft') prevSong();
});

// Initialize
initPlaylist();
loadSong(0);
audio.volume = 0.7;
</script>
</body>
</html>
